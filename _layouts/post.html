---
layout: default
---
<article class="post">
  <h1 class="post__title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post__subtitle">{{ page.subtitle }}</p>{% endif %}
  <p class="post__meta">{{ page.category }} · {{ page.date | date: "%-d %b %Y" }}</p>
  <div class="post__body">
    {{ content }}
  </div>
</article>
