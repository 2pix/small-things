<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body{% if page.category %} data-category="{{ page.category }}"{% endif %}>
  <header class="site-header">
    {% if page.url == '/' %}
    <div class="site-title-row site-title-row--home">
      <a href="{{ '/' | relative_url }}" class="site-title site-title--home">The Art of Small Things</a>
      <p class="site-subtitle site-subtitle--home">At home in a world crowded with agenda.</p>
    </div>
    {% endif %}
    {% include nav.html %}
  </header>

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <div class="toggle-row" role="group" aria-label="Reading preferences">
    <button class="toggle-btn" id="theme-toggle" type="button" aria-pressed="false">Sepia</button>
    <button class="toggle-btn" id="font-toggle" type="button" aria-pressed="false">Easy read</button>
  </div>
  <button class="back-to-top" aria-label="Back to top">↑</button>
  <script src="{{ '/assets/js/back-to-top.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/nav-badges.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/reading-toggles.js' | relative_url }}" defer></script>
</body>
</html>
