<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body{% if page.category %} data-category="{{ page.category }}"{% endif %}>
  <header class="site-header">
    {% if page.url == '/' %}
    <div class="site-title-row site-title-row--home">
      <a href="{{ '/' | relative_url }}" class="site-title site-title--home">The Art of Small Things</a>
      <p class="site-subtitle site-subtitle--home">A place to be without agenda, in a world full of it. At Home.</p>
    </div>
    {% else %}
    <div class="site-title-row">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      {% if page.title %}<p class="site-subtitle">{{ page.title }}</p>{% endif %}
    </div>
    {% endif %}
    {% include nav.html %}
  </header>

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <button class="back-to-top" aria-label="Back to top">↑</button>
  <script src="{{ '/assets/js/back-to-top.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/nav-badges.js' | relative_url }}" defer></script>
</body>
</html>
