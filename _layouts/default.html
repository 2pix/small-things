<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
  {% if page.layout == "section" and page.category == "black-cat" %}{% include scenes-banner.html %}{% endif %}
  <header class="site-header">
    <div class="site-title-row">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <p class="site-subtitle">{{ site.description }}</p>
    </div>
    {% include nav.html %}
  </header>

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <button class="back-to-top" aria-label="Back to top">↑</button>
  <script src="{{ '/assets/js/back-to-top.js' | relative_url }}" defer></script>
</body>
</html>
