---
layout: default
---
{% assign latest = site.posts | slice: 0, 5 %}

<section class="latest">
  <p class="latest-label">Latest</p>
  {% for post in latest %}
    {% include post-card.html post=post %}
  {% endfor %}
</section>

<section class="start-here">
  <article class="post-card post-card--start-here">
    <p class="post-card__eyebrow">Start Here →</p>
    <h2 class="post-card__title"><a href="{{ '/about/' | relative_url }}">About</a></h2>
    <p class="post-card__subtitle">At home in a world crowded with agenda.</p>
  </article>
</section>
