<nav class="stories-row">
  <a href="{{ '/' | relative_url }}" class="rail-logo" aria-label="{{ site.title }}">
    <span class="rail-logo__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="7"/>
        <line class="faint" x1="12" y1="12" x2="16.1" y2="7.6"/>
        <line class="faint" x1="12" y1="12" x2="6.9" y2="10"/>
        <line class="faint" x1="12" y1="12" x2="10" y2="16.8"/>
        <line class="faint" x1="12" y1="12" x2="17.1" y2="14.4"/>
        <circle class="dot" cx="12" cy="12" r="1.5"/>
        <circle class="dot" cx="16.1" cy="7.6" r="0.7"/>
        <circle class="dot" cx="6.9" cy="10" r="0.6"/>
        <circle class="dot" cx="10" cy="16.8" r="0.5"/>
        <circle class="dot" cx="17.1" cy="14.4" r="0.6"/>
      </svg>
    </span>
  </a>
  <div class="rail-nav-middle">
    {% for section in site.sections %}
    {% assign latest = site.categories[section.key] | first %}
    <a href="{{ site.baseurl }}/{{ section.key }}/" class="story-pill story-pill--{{ section.key }}{% if page.category == section.key %} is-active{% endif %}" data-section="{{ section.key }}"{% if latest %} data-latest="{{ latest.date | date: '%Y-%m-%d' }}"{% endif %}>
      <svg class="story-pill__icon" viewBox="0 0 24 24" aria-hidden="true">
        {% case section.key %}
        {% when 'black-cat' %}
        <circle cx="12" cy="12" r="7"/>
        <path d="M 8,18 L 8,14 Q 8,12 8.5,10.5 L 9,9 L 9.3,7 L 8,4.3 L 10.2,6.3 L 11.5,4 L 12,6.8 Q 13,7.2 14,8.5 Q 16.5,9 17,12.5 Q 17.2,15 16,17 L 16,18.5"/>
        <path d="M 15,17 Q 18.7,17.3 18.6,12.8 Q 18.5,10 16.3,9.3"/>
        {% when 'the-floor' %}
        <circle cx="12" cy="12" r="7"/>
        <path d="M 6.5,14.5 L 17.5,14.5"/>
        {% when 'small-things' %}
        <circle cx="12" cy="12" r="7"/>
        <path d="M 6.5,12.5 Q 12,17.8 17.5,12.5"/>
        <circle cx="12" cy="9.8" r="3.3"/>
        {% endcase %}
      </svg>
      <span class="story-pill__label">{{ section.label }}</span>
      <span class="story-pill__dot" aria-hidden="true"></span>
    </a>
    {% endfor %}
  </div>
  <a href="{{ '/about/' | relative_url }}" class="story-pill story-pill--about{% if page.url == '/about/' %} is-active{% endif %}">
    <svg class="story-pill__icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="7"/>
      <circle class="dot" cx="12" cy="12" r="1.3"/>
    </svg>
    <span class="story-pill__label">About</span>
  </a>
</nav>
