<article class="post-card{% if include.post.start_here %} post-card--start-here{% endif %}">
  {% if include.post.start_here %}<p class="post-card__eyebrow">Start Here →</p>{% endif %}
  <h2 class="post-card__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
  {% if include.post.subtitle %}<p class="post-card__subtitle">{{ include.post.subtitle }}</p>{% endif %}
  <p class="post-card__meta">{{ include.post.category }} · {{ include.post.date | date: "%-d %b %Y" }}</p>
</article>
