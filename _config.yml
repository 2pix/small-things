title: small things
description: Black Cat + Art of Small Things
url: "https://artofsmallthings.com"
baseurl: ""

theme: null

markdown: kramdown
permalink: /:categories/:year-:month-:day-:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sections:
  - key: black-cat
    label: Black Cat
  - key: the-floor
    label: The Floor
  - key: small-things
    label: The Art of

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

feed:
  path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  # vault instruments, not site content (2026 Oct 8): the index-sweep files and the
  # internal README carry vault conversation - the design doc's law is that none of
  # it renders on the live site.
  - 00-Index.md
  - 00-README.md
  - black-cat/00-Index.md
  - small-things/00-Index.md
  - the-floor/00-Index.md
  - about/00-Index.md
  - RULES.md
